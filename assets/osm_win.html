<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="container"></div>
</body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = null;
  var fixedMarker = null;
  var centerMarkerEl = null;

  function initMap(lat, lng, select, hasMarker) {
    if (map) {
      map.remove();
      map = null;
      centerMarkerEl = null;
      fixedMarker = null;
    }

    map = L.map('container', {
      center: [lat, lng],
      zoom: 16,
      zoomControl: true,
      attributionControl: true,
      scrollWheelZoom: 'center'
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    if (hasMarker) {
      fixedMarker = L.marker([lat, lng]).addTo(map);
    }

    if (select) {
      centerMarkerEl = document.createElement('div');
      centerMarkerEl.className = 'center-marker';
      document.getElementById('container').appendChild(centerMarkerEl);

      sendMsg();

      map.on('moveend', function () {
        sendMsg();
      });
    }
  }

  function sendMsg(){
    var center = map.getCenter();
    window.chrome.webview.postMessage(JSON.stringify({
      lat: center.lat,
      lng: center.lng
    }));
  }

  function getCenter() {
    if (!map) return null;
    var c = map.getCenter();
    return { lat: c.lat, lng: c.lng };
  }

  function setMarker(lat, lng) {
    if (!map) return;
    if (fixedMarker) {
      fixedMarker.setLatLng([lat, lng]);
    } else {
      fixedMarker = L.marker([lat, lng]).addTo(map);
    }
  }
</script>
</html>
